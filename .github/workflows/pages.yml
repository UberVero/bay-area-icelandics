name: Validate and publish website

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Protect analytics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Exercise missing and broken tracker cases
        run: python3 -m unittest discover -s tests -v
      - name: Require the existing Fathom tracker
        run: python3 scripts/check_analytics.py index.html
      - name: Package the website and validate the published copy
        run: |
          mkdir -p _site
          cp index.html CNAME hero.jpeg _site/
          cp -R images _site/images
          python3 scripts/check_analytics.py _site/index.html
      - name: Upload the checked website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    name: Publish checked website
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy only after analytics checks pass
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify the live tracker after publishing
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 20 "${SITE_URL}?analytics-check=${GITHUB_SHA}" -o /tmp/live-index.html && python3 scripts/check_analytics.py /tmp/live-index.html; then
              exit 0
            fi
            sleep 15
          done
          echo 'The deployed site failed its live analytics check.' >&2
          exit 1
